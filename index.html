<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetcode Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Progress Tracker</h1>
        <p>Track your progress</p>
    </header>
    <section class="stats">
        <div class="stat-card">
            <h2>Total Solved</h2>
            <p id="total-solved">0</p>
        </div>
        <div class="stat-card">
            <h2>Easy Solved</h2>
            <p id="easy-solved">0</p>
        </div>
        <div class="stat-card">
            <h2>Medium Solved</h2>
            <p id="medium-solved">0</p>
        </div>
        <div class="stat-card">
            <h2>Hard Solved</h2>
            <p id="hard-solved">0</p>
        </div>
    </section>
    <section class="controls">
        <input type="text" id="search-input" placeholder="Search problems......">
        <button id="show-add-problem">+</button>

        <select id="difficulty-filter">
            <option value="All">All</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>
        <select id="topic-filter">
            <option value="all">All Topics</option>
            <option value="Array">Array</option>
            <option value="String">String</option>
            <option value="Binary Search">Binary Search</option>
            <option value="Linked List">Linked List</option>
            <option value="Stack">Stack</option>
            <option value="Tree">Tree</option>
            <option value="Graph">Graph</option>
        </select>
    </section>


    <section class="add-problem" id="add-problem-section">

        <input type="text" id="problem-title" placeholder="Problem name">
        <div class="difficulty-options">
            <span>Difficulty</span>
        
            <button type="button" class="difficulty-btn" value="Easy">Easy</button>
            <button type="button" class="difficulty-btn" value="Medium">Medium</button>
            <button type="button" class="difficulty-btn" value="Hard">Hard</button>
        </div>

        <div class="topic-option">
            <span>Topic</span>
                
            <select id="problem-topic">
                <option value="" selected disabled>Select Topic</option>
                <option value="Array">Array</option>
                <option value="String">String</option>
                <option value="Binary Search">Binary Search</option>
                <option value="Linked List">Linked List</option>
                <option value="Stack">Stack</option>
                <option value="Tree">Tree</option>
                <option value="Graph">Graph</option>
            </select>
        </div>
        <button id="add-problem-btn">Add Problem</button>
    </section>
    <section class="problems-section">
        <div class="problem-header">
            <span></span>
            <span>Problem</span>
            <span>Level</span>
            <span>Topic</span>
            <span>Status</span>
        </div>
        

        <div id="problem-list">
        <!-- Problems will be created by JavaScript -->
        </div>

    </section>
    
    <script src="script.js"></script>
</body>
</html>
